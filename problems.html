<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problems — Epsilon Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <style>
    :root { --bg: #0a0a0a; --cream: #e8e0d0; --cream-dim: rgba(232,224,208,0.5); --cream-faint: rgba(232,224,208,0.08); --cream-subtle: rgba(232,224,208,0.15); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--cream); font-family: 'Inter', sans-serif; font-weight: 300; line-height: 1.7; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 3rem; background: rgba(10,10,10,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--cream-subtle); }
    .nav-logo { font-family: 'Courier Prime', monospace; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; color: var(--cream); text-decoration: none; display: flex; align-items: center; gap: 0.75rem; }
    .nav-logo .epsilon-glyph { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 400; line-height: 1; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { font-family: 'Courier Prime', monospace; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--cream); }
    .page-header { padding: 10rem 3rem 3rem; max-width: 1100px; margin: 0 auto; border-bottom: 1px solid var(--cream-subtle); }
    .page-eyebrow { font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.25em; color: var(--cream-dim); margin-bottom: 1.5rem; }
    .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 400; line-height: 1.05; max-width: 700px; }
    .page-title em { font-style: italic; color: var(--cream-dim); }
    .filter-bar { max-width: 1100px; margin: 0 auto; padding: 2rem 3rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--cream-subtle); }
    .filter-label { font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); margin-right: 0.5rem; }
    .filter-btn { font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; padding: 0.4rem 1rem; border: 1px solid var(--cream-subtle); background: transparent; color: var(--cream-dim); cursor: pointer; border-radius: 2px; transition: all 0.2s; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--cream); color: var(--cream); }
    .problems-list { max-width: 1100px; margin: 0 auto; padding: 0 3rem 6rem; }
    .problem-row { display: grid; grid-template-columns: 60px 1fr auto; gap: 2rem; align-items: start; padding: 2rem 0; border-bottom: 1px solid var(--cream-subtle); color: inherit; transition: background 0.15s; cursor: pointer; }
    .problem-row:hover { background: var(--cream-faint); margin: 0 -3rem; padding: 2rem 3rem; }
    .prob-num { font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); padding-top: 0.35rem; }
    .prob-cat { font-family: 'Courier Prime', monospace; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); margin-bottom: 0.3rem; }
    .prob-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 400; margin-bottom: 0.4rem; }
    .prob-desc { font-size: 0.875rem; color: var(--cream-dim); line-height: 1.6; max-width: 560px; }
    .prob-difficulty { font-family: 'Courier Prime', monospace; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; padding: 0.3rem 0.7rem; border-radius: 2px; white-space: nowrap; margin-top: 0.35rem; }
    .diff-p1 { border: 1px solid rgba(232,224,208,0.2); color: rgba(232,224,208,0.4); }
    .diff-p2 { border: 1px solid rgba(232,224,208,0.5); color: rgba(232,224,208,0.7); }
    .diff-p3 { border: 1px solid rgba(232,224,208,0.8); color: rgba(232,224,208,1); }
    .loading-state, .empty-state { padding: 4rem 3rem; font-family: 'Courier Prime', monospace; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--cream-dim); }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.88); backdrop-filter: blur(6px); overflow-y: auto; padding: 2rem 1rem; }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal { background: #111; border: 1px solid var(--cream-subtle); border-radius: 3px; max-width: 780px; width: 100%; margin: auto; padding: 3rem; position: relative; }
    .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); background: none; border: 1px solid var(--cream-subtle); padding: 0.35rem 0.75rem; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
    .modal-close:hover { color: var(--cream); border-color: var(--cream); }
    .modal-loading { font-family: 'Courier Prime', monospace; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--cream-dim); padding: 2rem 0; }
    .modal-github-link { display: inline-block; margin-top: 2.5rem; font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); text-decoration: none; border-bottom: 1px solid var(--cream-subtle); padding-bottom: 1px; transition: all 0.2s; }
    .modal-github-link:hover { color: var(--cream); border-color: var(--cream); }
    .md-body h1 { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 400; margin-bottom: 1rem; line-height: 1.15; }
    .md-body h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 400; margin: 2.5rem 0 0.75rem; color: var(--cream); border-bottom: 1px solid var(--cream-subtle); padding-bottom: 0.4rem; }
    .md-body h3 { font-family: 'Courier Prime', monospace; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); margin: 1.5rem 0 0.5rem; text-transform: uppercase; }
    .md-body p { font-size: 0.95rem; color: var(--cream-dim); line-height: 1.85; margin-bottom: 1rem; }
    .md-body strong { color: var(--cream); font-weight: 500; }
    .md-body em { font-style: italic; }
    .md-body hr { border: none; border-top: 1px solid var(--cream-subtle); margin: 1.75rem 0; }
    .md-body blockquote { border-left: 2px solid var(--cream-subtle); padding-left: 1.2rem; margin: 1rem 0; }
    .md-body blockquote p { color: var(--cream-dim); font-style: italic; }
    .md-body code { font-family: 'Courier Prime', monospace; font-size: 0.85rem; background: var(--cream-faint); padding: 0.15rem 0.4rem; border-radius: 2px; color: var(--cream); }
    .md-body pre { background: var(--cream-faint); padding: 1.2rem; border-radius: 2px; overflow-x: auto; margin-bottom: 1rem; }
    .md-body pre code { background: none; padding: 0; }
    .md-body ul, .md-body ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    .md-body li { font-size: 0.95rem; color: var(--cream-dim); line-height: 1.75; margin-bottom: 0.3rem; }
    .md-meta { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .md-meta-tag { font-family: 'Courier Prime', monospace; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; padding: 0.25rem 0.7rem; border: 1px solid var(--cream-subtle); color: var(--cream-dim); border-radius: 2px; }
    .katex { font-size: 1em !important; color: var(--cream); }
    .katex-display { margin: 1.5rem 0; overflow-x: auto; }

    footer { border-top: 1px solid var(--cream-subtle); padding: 2.5rem 3rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .footer-left { font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; color: var(--cream-dim); }
    .footer-links { display: flex; gap: 2rem; list-style: none; }
    .footer-links a { font-family: 'Courier Prime', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; color: var(--cream-dim); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--cream); }
    @media (max-width: 768px) { nav { padding: 1rem 1.5rem; } .nav-links { gap: 1.5rem; } .page-header { padding: 8rem 1.5rem 3rem; } .filter-bar { padding: 1.5rem; } .problems-list { padding: 0 1.5rem 4rem; } .problem-row { grid-template-columns: 40px 1fr; } .prob-difficulty { display: none; } .modal { padding: 2rem 1.25rem; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo"><span class="epsilon-glyph">ε</span><span>EPSILON ARCHIVE</span></a>
    <ul class="nav-links">
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="problems.html" class="active">PROBLEMS</a></li>
      <li><a href="path.html">8-WEEK PATH</a></li>
      <li><a href="wiki.html">WIKI</a></li>
      <li><a href="https://github.com/AIyer1155/Epsilon-Archive" target="_blank">GITHUB ↗</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <p class="page-eyebrow">PROBLEM ARCHIVE</p>
    <h1 class="page-title"><span id="problem-count-header">—</span> problems.<br><em>Four lenses each.</em></h1>
  </div>

  <div class="filter-bar" id="filterBar">
    <span class="filter-label">FILTER:</span>
    <button class="filter-btn active" data-cat="all">ALL</button>
  </div>

  <div class="problems-list" id="problemsList">
    <div class="loading-state">LOADING PROBLEMS...</div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose">CLOSE ✕</button>
      <div id="modalContent"><div class="modal-loading">LOADING...</div></div>
    </div>
  </div>

  <footer>
    <div class="footer-left">ε EPSILON ARCHIVE · OPEN SOURCE · MIT LICENSE</div>
    <ul class="footer-links">
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="problems.html">PROBLEMS</a></li>
      <li><a href="https://github.com/AIyer1155/Epsilon-Archive" target="_blank">GITHUB</a></li>
    </ul>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

  <script>
    const REPO  = 'AIyer1155/Epsilon-Archive';
    const RAW   = `https://raw.githubusercontent.com/${REPO}/main`;

    const CATEGORY_META = {
      CP: { label: 'Conditional Probability', slug: 'conditional-probability' },
      EV: { label: 'Expected Value',          slug: 'expected-value' },
      GP: { label: 'Geometric Probability',   slug: 'geometric-probability' },
      IV: { label: 'Invariants',              slug: 'invariants' },
      RD: { label: 'Recursive Decomposition', slug: 'recursive-decomposition' },
      SY: { label: 'Symmetry',               slug: 'symmetry' },
      CM: { label: 'Combinatorics',           slug: 'combinatorics' },
      GT: { label: 'Game Theory',             slug: 'game-theory' },
      FE: { label: 'Fermi Estimation',        slug: 'fermi-estimation' },
      LA: { label: 'Linear Algebra',          slug: 'linear-algebra' },
      NT: { label: 'Number Theory',           slug: 'number-theory' },
      RA: { label: 'Real Analysis',           slug: 'real-analysis' },
    };

    let allProblems = [];

    function parseMarkdown(filename, raw) {
      const prefix = filename.slice(0, 2);
      const id = filename.replace('.md', '').toUpperCase();
      const titleMatch  = raw.match(/^#\s+(.+)$/m);
      const catMatch    = raw.match(/\*\*Category:\*\*\s*(.+)/);
      const diffMatch   = raw.match(/\*\*Difficulty:\*\*\s*(P\d)/i);
      const sourceMatch = raw.match(/\*\*Source:\*\*\s*(.+)/);
      const probMatch   = raw.match(/##\s+Problem\s*\n+([\s\S]+?)(?:\n##|\n---)/);

      const title      = titleMatch  ? titleMatch[1].trim()  : id;
      const category   = catMatch    ? catMatch[1].trim()    : (CATEGORY_META[prefix]?.label || prefix);
      const difficulty = diffMatch   ? diffMatch[1].toUpperCase() : 'P1';
      const source     = sourceMatch ? sourceMatch[1].trim() : '';
      const slug       = CATEGORY_META[prefix]?.slug || prefix.toLowerCase();

      let desc = '';
      if (probMatch) {
        desc = probMatch[1].replace(/\n+/g, ' ').replace(/\*\*/g, '').replace(/\$/g, '').trim();
        if (desc.length > 180) desc = desc.slice(0, 180) + '…';
      }

      return { id, prefix, title, category, difficulty, source, desc, slug, filename, raw };
    }

    function diffClass(d) {
      return d === 'P3' ? 'diff-p3' : d === 'P2' ? 'diff-p2' : 'diff-p1';
    }

    function renderList(cat) {
      const filtered = cat === 'all' ? allProblems : allProblems.filter(p => p.slug === cat);
      const list = document.getElementById('problemsList');
      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state">NO PROBLEMS IN THIS CATEGORY YET.</div>';
        return;
      }
      list.innerHTML = filtered.map(p => `
        <div class="problem-row" data-filename="${p.filename}" tabindex="0" role="button" aria-label="Open ${p.title}">
          <div class="prob-num">${p.id}</div>
          <div class="prob-main">
            <p class="prob-cat">${p.category.toUpperCase()}</p>
            <p class="prob-title">${p.title}</p>
            <p class="prob-desc">${p.desc}</p>
          </div>
          <div class="prob-difficulty ${diffClass(p.difficulty)}">${p.difficulty}</div>
        </div>
      `).join('');

      list.querySelectorAll('.problem-row').forEach(row => {
        row.addEventListener('click', () => openModal(row.dataset.filename));
        row.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(row.dataset.filename); });
      });
    }

    function setFilter(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList(cat);
    }

    // MODAL
    const overlay      = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');

    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    function openModal(filename) {
      const problem = allProblems.find(p => p.filename === filename);
      if (!problem) return;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';

      // Strip metadata lines, render markdown, then render math
      let raw = problem.raw
        .replace(/\*\*Category:\*\*.*\n?/g, '')
        .replace(/\*\*Difficulty:\*\*.*\n?/g, '')
        .replace(/\*\*Source:\*\*.*\n?/g, '')
        .replace(/\*\*Tags:\*\*.*\n?/g, '');

      const metaTags = [problem.category, problem.difficulty, problem.source]
        .filter(Boolean)
        .map(t => `<span class="md-meta-tag">${t}</span>`)
        .join('');

      modalContent.innerHTML = `
        <div class="md-meta">${metaTags}</div>
        <div class="md-body">${marked.parse(raw)}</div>
        <a class="modal-github-link" href="https://github.com/${REPO}/blob/main/${problem.filename}" target="_blank">VIEW RAW ON GITHUB ↗</a>
      `;

      renderMathInElement(modalContent, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$',  right: '$',  display: false },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
        ],
        throwOnError: false
      });
    }

    // LOAD — reads manifest.json (no API rate limits), then fetches each raw .md
    async function fetchAndRender() {
      try {
        const manifest = await fetch(`${RAW}/manifest.json`).then(r => r.json());

        const raws = await Promise.all(
          manifest.map(filename => fetch(`${RAW}/${filename}`).then(r => r.text()))
        );

        allProblems = manifest.map((filename, i) => parseMarkdown(filename, raws[i]));
        allProblems.sort((a, b) => a.id.localeCompare(b.id));

        document.getElementById('problem-count-header').textContent = allProblems.length;

        // Build filter buttons from categories present
        const seenSlugs = new Set();
        const filterBar = document.getElementById('filterBar');
        allProblems.forEach(p => {
          if (!seenSlugs.has(p.slug)) {
            seenSlugs.add(p.slug);
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.cat = p.slug;
            btn.textContent = p.category.toUpperCase();
            btn.addEventListener('click', () => setFilter(p.slug, btn));
            filterBar.appendChild(btn);
          }
        });

        document.querySelector('[data-cat="all"]').addEventListener('click', function () {
          setFilter('all', this);
        });

        renderList('all');

      } catch (err) {
        console.error(err);
        document.getElementById('problemsList').innerHTML =
          `<div class="empty-state">COULD NOT LOAD — <a href="https://github.com/${REPO}" style="color:var(--cream)">VIEW ON GITHUB ↗</a></div>`;
        document.getElementById('problem-count-header').textContent = '?';
      }
    }

    fetchAndRender();
  </script>
</body>
</html>
