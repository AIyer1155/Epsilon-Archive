  <text x="64" y="-28" font-family="Courier Prime, monospace" font-size="10" font-weight="700" fill="#e8e0d0" letter-spacing="3" style="fill:rgb(232, 224, 208);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Courier Prime&quot;, monospace;font-size:10px;font-weight:700;text-anchor:start;dominant-baseline:auto">EPSILON</text>
